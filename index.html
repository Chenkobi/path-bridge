<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-title" content="נתיב במק">
<link rel="apple-touch-icon" href="icon.png">
<title>נתיב במק</title>
<style>
:root{--ink:#16181d;--muted:#7b8089;--line:#e5e7eb;--blue:#1677ff;--surface:#fff;--bg:#f2f3f6;--green:#42c997}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}main{max-width:560px;margin:auto;padding:28px 20px 42px}.brand{display:flex;align-items:center;gap:11px;margin:8px 0 30px}.mark{width:43px;height:43px;border-radius:13px;background:#20252b;position:relative;box-shadow:inset 0 0 0 5px #20252b}.mark:before{content:"";position:absolute;inset:9px 8px 7px 12px;border-radius:7px 7px 11px 11px;background:linear-gradient(145deg,#51e9ad,#56d8ff)}.mark:after{content:"";position:absolute;left:17px;top:20px;width:15px;height:3px;border-radius:5px;background:#20252b;box-shadow:0 7px #20252b}.brand strong{font-size:20px;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.hero{margin-bottom:18px}.hero h1{font-size:29px;line-height:1.05;margin:0 0 8px;letter-spacing:-.05em}.hero p{font-size:14px;color:var(--muted);margin:0}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 7px 22px #aeb5c220;margin-top:15px}.label{font-size:11px;color:var(--muted);margin-bottom:9px}.pathbox{direction:ltr;text-align:left;unicode-bidi:plaintext;width:100%;height:124px;resize:none;border:0;outline:0;background:transparent;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#30353d;padding:0}.tool-row{display:flex;gap:9px;margin-top:10px}.button{appearance:none;border:0;border-radius:13px;padding:13px 10px;font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;width:100%;cursor:pointer}.tool-row .button{background:#eef0f3;color:#545b66}.primary{background:var(--blue);color:#fff;box-shadow:0 6px 13px #1677ff30;margin-top:13px}.secondary{background:#eef0f3;color:#4d5560}.divider{height:1px;background:var(--line);margin:22px 0}.status{display:flex;align-items:center;gap:7px;color:#707782;font-size:11px;margin-top:16px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #42c99722}.note{text-align:center;color:#9aa0a9;font-size:11px;margin-top:26px}.toast{min-height:18px;margin-top:12px;text-align:center;color:#68717d;font-size:13px}
</style>
</head>
<body><main>
<div class="brand"><div class="mark"></div><div><strong>נתיב במק</strong><small>PATH BRIDGE</small></div></div>
<section class="hero"><h1>מה רוצים לפתוח?</h1><p>הדבק הודעת WhatsApp או שלח נתיב מהמק.</p></section>
<section class="card"><div class="label">הנתיב שנמצא בהודעה</div><textarea id="text" class="pathbox" spellcheck="false" autocapitalize="off"></textarea><div class="tool-row"><button type="button" class="button" id="clearBtn">נקה</button><button type="button" class="button" id="pasteBtn">הדבק</button></div></section>
<button type="button" class="button primary" id="openBtn">פתח ב־Finder</button>
<div id="status" class="toast"></div>
<div class="divider"></div>
<section class="card"><div class="label">הנתיב האחרון מהמק</div><div class="pathbox" style="height:auto;min-height:42px">לחיצה על הכפתור תפתח את הנתיב האחרון שנשלח מהמק.</div><button type="button" class="button secondary" id="whatsappBtn">פתח WhatsApp עם הנתיב</button></section>
<div class="status"><span class="dot"></span>המק זמין ברשת המקומית</div>
<div class="note">פשוט. מקומי. בלי WhatsApp Web.</div>
<script>
const BRIDGE='http://Kobis-Mac-Studio.local:8765';
const text=document.getElementById('text'),status=document.getElementById('status');
function cleanPath(value){return value.trim().replace(/^["'“”‘’]+/,'').replace(/["'“”‘’]+$/,'');}
function clearText(){text.value='';status.textContent='';}
async function pasteText(){try{const raw=await navigator.clipboard.readText();const match=raw.match(/\/Volumes\/[^\x0D\x0A]+/);if(!match){text.value='';status.textContent='לא מצאתי בהודעה נתיב שמתחיל ב־/Volumes/';return}text.value=cleanPath(match[0]);status.textContent='הנתיב חולץ מההודעה.'}catch(e){status.textContent='האייפון מבקש אישור Paste — לחץ על Paste בחלון שקפץ.'}}
function openOnMac(){const match=text.value.match(/\/Volumes\/[^\x0D\x0A]+/);const path=match?cleanPath(match[0]):'';if(!path){status.textContent='לא מצאתי נתיב שמתחיל ב־/Volumes/';return}window.location.href=BRIDGE+'/open-web?text='+encodeURIComponent(path)}
function openWhatsAppLatest(){window.location.href=BRIDGE+'/whatsapp-latest'}
document.getElementById('clearBtn').addEventListener('click',clearText);document.getElementById('pasteBtn').addEventListener('click',pasteText);document.getElementById('openBtn').addEventListener('click',openOnMac);document.getElementById('whatsappBtn').addEventListener('click',openWhatsAppLatest);
</script></main></body></html>
