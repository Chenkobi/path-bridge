<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="נתיב במק">
<link rel="apple-touch-icon" href="icon.png">
<title>פתיחת נתיב במק</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:20px;background:#f5f5f7;color:#111}main{max-width:600px;margin:auto}h1{font-size:25px}textarea{width:100%;height:180px;font-size:17px;padding:12px;border:1px solid #bbb;border-radius:10px;direction:ltr;text-align:left;unicode-bidi:plaintext}button{width:100%;margin-top:14px;padding:15px;font-size:18px;border:0;border-radius:10px;background:#3478f6;color:#fff}.tool-row{display:flex;gap:10px}.tool-row button{flex:1;background:#555}#status{margin-top:16px;font-size:17px;white-space:pre-wrap}.note{font-size:14px;color:#666}
</style>
</head>
<body><main>
<h1>פתיחת נתיב במק</h1>
<p>העתק הודעת WhatsApp שלמה, ואז לחץ על <b>הדבק</b>:</p>
<textarea id="text" autofocus></textarea>
<div class="tool-row"><button type="button" id="clearBtn">נקה</button><button type="button" id="pasteBtn">הדבק</button></div>
<button type="button" id="openBtn">פתח במק</button>
<hr>
<button onclick="openWhatsAppLatest()">פתח WhatsApp עם הנתיב האחרון מהמק</button>
<div id="status"></div>
<p class="note">הכפתור הדבק פועל רק בלחיצה ישירה, בהתאם לאבטחת iPhone.</p>
<script>
const BRIDGE='http://Kobis-Mac-Studio.local:8765';
function clearText(){document.getElementById('text').value='';document.getElementById('status').textContent='';}
function cleanPath(value){
  return value.trim().replace(/^["'“”‘’]+/, '').replace(/["'“”‘’.,;:)]}+$/, '');
}
async function pasteText(){
  const status=document.getElementById('status');
  try{
    const raw=await navigator.clipboard.readText();
    const match=raw.match(/\/Volumes\/[^\x0D\x0A]+/);
    if(!match){
      document.getElementById('text').value='';
      status.textContent='לא מצאתי בהודעה נתיב שמתחיל ב־/Volumes/';
      return;
    }
    document.getElementById('text').value=cleanPath(match[0]);
    status.textContent='הנתיב חולץ מההודעה.';
  }catch(e){status.textContent='האייפון חסם גישה ל־Clipboard. ודא שהאתר פתוח בכתובת HTTPS.';}
}
function extractPath(){
  const m=document.getElementById('text').value.match(/\/Volumes\/[^\x0D\x0A]+/);
  return m ? cleanPath(m[0]) : '';
}
function openOnMac(){
  const path=extractPath();
  if(!path){document.getElementById('status').textContent='לא מצאתי נתיב שמתחיל ב־/Volumes/';return;}
  window.location.href=BRIDGE+'/open-web?text='+encodeURIComponent(path);
}
function openWhatsAppLatest(){window.location.href=BRIDGE+'/whatsapp-latest';}
document.getElementById('clearBtn').addEventListener('click', clearText);
document.getElementById('pasteBtn').addEventListener('click', pasteText);
document.getElementById('openBtn').addEventListener('click', openOnMac);
</script>
</main></body></html>
